name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid tag: $TAG"; exit 1; }
          grep -qF "version = \"${TAG#v}\"" _meta.lua || { echo "_meta.lua doesn't have version ${TAG#v}"; exit 1; }
          git merge-base --is-ancestor "$TAG^{commit}" origin/master || { echo "$TAG is not on master"; exit 1; }

      - name: Build zip
        run: git archive --format=zip --prefix=minimenu.koplugin/ -o minimenu.koplugin.zip "$TAG"

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --exclude='*-*' "$TAG^" 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+"$prev.."}"$TAG" > notes.md
          [ -z "$prev" ] || printf '\n**Full changelog**: %s/compare/%s...%s\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$TAG" >> notes.md

      - name: Create release
        run: |
          gh release create "$TAG" minimenu.koplugin.zip --verify-tag --title "$TAG" \
            --notes-file notes.md $([[ "$TAG" == *-* ]] && echo --prerelease)
